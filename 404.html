<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages catch-all 404: preserves the incoming deep-link path and parameters
    var target = "https://kawishkamd.pages.dev" + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 2rem;
      max-width: 420px;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <p>Redirecting to <a id="dest" href="https://kawishkamd.pages.dev/">kawishkamd.pages.dev</a>...</p>
    <script>
      var dest = document.getElementById("dest");
      if (dest) dest.href = target;
    </script>
  </div>
</body>
</html>
