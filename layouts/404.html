{{ define "main" }}
<section class="hero-new" style="min-height: 75vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
  <div class="hero-text" style="display: flex; flex-direction: column; align-items: center;">
    <h1 style="font-size: clamp(6rem, 15vw, 10rem); color: var(--red); margin-bottom: 0;">404</h1>
    <div class="hero-subtitle-wrap" style="justify-content: center; margin-bottom: 2rem;">
      <div class="line"></div>
      <span class="hero-subtitle">Page Not Found</span>
      <div class="line"></div>
    </div>
    <p class="hero-description" style="max-width: 440px; margin: 0 auto 2.5rem auto; text-align: center;">
      The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
    </p>
    <a href="{{ "/" | relLangURL }}" class="btn-say-hello">
      <span class="bx-icon">{{ partial "icon/bx-compass.html" . }}</span> Back to Home
    </a>
  </div>
</section>
{{ end }}
